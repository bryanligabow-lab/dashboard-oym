<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Proyectos OYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== TEMAS ===== */
:root,:root[data-theme="oscuro"]{
  --bg:#0f1318; --surface:#161b22; --surface2:#1c222b; --surface3:#232a34;
  --line:#242b35; --line2:#323b47;
  --txt:#e8ecf1; --muted:#8e99a8; --faint:#656f7d;
  --accent:#3b82f6;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --na:#6b7280;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.18);
}
:root[data-theme="claro"]{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#f8fafc; --surface3:#eef2f7;
  --line:#e2e8f0; --line2:#cbd5e1;
  --txt:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --accent:#2563eb;
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626; --na:#94a3b8;
  --sh:0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.06);
}
:root[data-theme="pastel"]{
  --bg:#f7f4fb; --surface:#ffffff; --surface2:#faf7fd; --surface3:#f1ebf8;
  --line:#e9e1f3; --line2:#d7cae9;
  --txt:#3b3054; --muted:#7c6f94; --faint:#a89cbd;
  --accent:#8b7ad6;
  --ok:#5bbd96; --warn:#e0a85c; --danger:#e08585; --na:#b3a9c4;
  --sh:0 1px 2px rgba(80,60,120,.05), 0 4px 14px rgba(80,60,120,.07);
}
:root[data-theme="arena"]{
  --bg:#f7f3ec; --surface:#fffdf9; --surface2:#faf6ef; --surface3:#f0e9dd;
  --line:#e8dfd0; --line2:#d5c7b0;
  --txt:#3a3228; --muted:#7a6e5d; --faint:#a89a85;
  --accent:#b07d3a;
  --ok:#5f9d5f; --warn:#cf9440; --danger:#c4603f; --na:#a89a85;
  --sh:0 1px 2px rgba(80,60,30,.05), 0 4px 14px rgba(80,60,30,.07);
}
:root[data-theme="noche"]{
  --bg:#0b1020; --surface:#131a30; --surface2:#182039; --surface3:#202a47;
  --line:#222c4a; --line2:#32406a;
  --txt:#e4e9f7; --muted:#8b97b8; --faint:#646f91;
  --accent:#6366f1;
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --na:#6b7280;
  --sh:0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.25);
}
:root[data-theme="grafito"]{
  --bg:#141414; --surface:#1d1d1d; --surface2:#242424; --surface3:#2e2e2e;
  --line:#2c2c2c; --line2:#3d3d3d;
  --txt:#ececec; --muted:#9a9a9a; --faint:#6e6e6e;
  --accent:#a1a1aa;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --na:#6b7280;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.2);
}
/* derivados: se recalculan solos con el tema y el color elegido */
:root{
  --accent-soft:color-mix(in srgb, var(--accent) 14%, transparent);
  --ok-soft:color-mix(in srgb, var(--ok) 13%, transparent);
  --warn-soft:color-mix(in srgb, var(--warn) 13%, transparent);
  --danger-soft:color-mix(in srgb, var(--danger) 13%, transparent);
  --r:14px; --r-sm:9px;
}
:root,:root[data-theme="oscuro"],:root[data-theme="noche"],:root[data-theme="grafito"]{color-scheme:dark}
:root[data-theme="claro"],:root[data-theme="pastel"],:root[data-theme="arena"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit}

/* ============ APP BAR ============ */
.appbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.appbar-in{max-width:1240px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px; flex:none}
.logo{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:linear-gradient(145deg,#3b82f6,#1d4ed8);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:13px; letter-spacing:-.3px;
  box-shadow:0 2px 10px rgba(59,130,246,.35);
}
.brand b{font-size:14px; font-weight:700; letter-spacing:-.2px; display:block; line-height:1.2}
.brand span{font-size:11px; color:var(--muted); display:block}

.gnav{display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex:1 1 auto}
.gnav .nlbl{font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); margin-right:2px}
.gbtn{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  background:var(--surface2); border:1px solid var(--line); border-radius:10px;
  padding:6px 11px 6px 7px; color:var(--muted); font-size:12.5px; font-weight:600; transition:.14s;
}
.gbtn:hover{color:var(--txt); border-color:var(--line2); transform:translateY(-1px)}
.gbtn.active{
  background:linear-gradient(160deg,#3b82f6,#2563eb); border-color:#2563eb; color:#fff;
  box-shadow:0 2px 12px rgba(59,130,246,.4);
}
.gbtn .num{
  display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; flex:none;
  border-radius:6px; background:var(--surface3); font-size:11px; font-weight:800; color:var(--accent);
}
.gbtn.active .num{background:rgba(255,255,255,.25); color:#fff}
.gbtn .gp{font-size:10.5px; font-weight:700; opacity:.75; font-variant-numeric:tabular-nums}
.iconbtn{
  background:var(--surface2); border:1px solid var(--line); color:var(--muted);
  width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px; flex:none;
  display:flex; align-items:center; justify-content:center; transition:.14s;
}
.iconbtn:hover{color:var(--txt); border-color:var(--line2)}

/* ============ LAYOUT ============ */
.wrap{max-width:1240px; margin:0 auto; padding:26px 20px 90px}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.pagehead h1{margin:0; font-size:23px; font-weight:800; letter-spacing:-.5px}
.pagehead p{margin:4px 0 0; color:var(--muted); font-size:13px}
.gtag{
  display:inline-flex; align-items:center; gap:7px; background:var(--accent-soft);
  border:1px solid rgba(59,130,246,.3); color:var(--accent);
  padding:6px 13px; border-radius:30px; font-size:12px; font-weight:700;
}
.gtag .dot{width:7px; height:7px; border-radius:50%; background:var(--accent)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.panel-h{
  padding:14px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.panel-h h2{margin:0; font-size:13px; font-weight:700; letter-spacing:.2px}
.panel-h .sub{font-size:11.5px; color:var(--muted); font-weight:500}
.panel-b{padding:18px}

/* ---- identity ---- */
.idgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px 22px}
.fld.wide{grid-column:span 2}
@media(max-width:700px){ .fld.wide{grid-column:span 1} }
.fld label{
  display:block; font-size:10.5px; font-weight:700; letter-spacing:.7px;
  text-transform:uppercase; color:var(--faint); margin-bottom:6px;
}
.fld input, .fld select{
  width:100%; background:var(--surface2); border:1px solid var(--line);
  color:var(--txt); border-radius:var(--r-sm); padding:9px 11px; font-size:13.5px;
  outline:none; transition:.14s;
}
.fld input:focus, .fld select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.fld input::placeholder{color:var(--faint)}
.dates{display:flex; gap:10px; align-items:center}
.dates input{font-size:13px; padding:9px 10px; min-width:0; flex:1 1 0}
.dates span{color:var(--faint); flex:none}

/* ---- KPI ---- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin:18px 0}
.kpi{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 17px; box-shadow:var(--sh); position:relative; overflow:hidden;
}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent)}
.kpi.k-ok::before{background:var(--ok)} .kpi.k-warn::before{background:var(--warn)}
.kpi.k-dan::before{background:var(--danger)} .kpi.k-mut::before{background:var(--na)}
.kpi .kl{font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
.kpi .kv{font-size:26px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums; line-height:1}
.kpi .kv small{font-size:14px; font-weight:600; color:var(--muted); letter-spacing:0}
.kpi .kf{font-size:11.5px; color:var(--muted); margin-top:7px}
.kpi.k-ok .kv{color:var(--ok)} .kpi.k-warn .kv{color:var(--warn)} .kpi.k-dan .kv{color:var(--danger)}

.kpi-ring{display:flex; align-items:center; gap:15px}
.ring{position:relative; width:72px; height:72px; flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; letter-spacing:-.5px}

/* ---- two col ---- */
.grid2{display:grid; grid-template-columns:1.25fr 1fr; gap:16px; margin-bottom:20px}
@media(max-width:900px){ .grid2{grid-template-columns:1fr} }

.pbar{margin-bottom:15px}
.pbar:last-child{margin-bottom:0}
.pbar .pt{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:12.5px}
.pbar .pt b{font-weight:600}
.pbar .pt span{color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.track{height:7px; background:var(--surface3); border-radius:10px; overflow:hidden}
.track i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,#3b82f6,#22c55e); transition:width .4s ease}
.track.t-full i{background:var(--ok)}
.track.t-zero i{background:var(--line2)}

/* ---- alerts ---- */
.alert{
  display:flex; gap:11px; padding:11px 13px; border-radius:var(--r-sm);
  margin-bottom:9px; font-size:12.5px; border:1px solid transparent; align-items:flex-start;
}
.alert:last-child{margin-bottom:0}
.alert .ai{font-size:14px; line-height:1.2; flex:none}
.alert b{display:block; font-weight:600; margin-bottom:1px}
.alert small{color:var(--muted); font-size:11.5px}
.a-dan{background:var(--danger-soft); border-color:rgba(239,68,68,.25)}
.a-dan b{color:var(--danger)}
.a-warn{background:var(--warn-soft); border-color:rgba(245,158,11,.25)}
.a-warn b{color:var(--warn)}
.a-ok{background:var(--ok-soft); border-color:rgba(34,197,94,.22)}
.a-ok b{color:var(--ok)}
.a-info{background:var(--surface2); border-color:var(--line)}

/* ---- tabs ---- */
.tabs{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:0}
.tab{
  position:relative; background:transparent; border:none; border-bottom:2px solid transparent;
  color:var(--muted); padding:10px 15px 11px; cursor:pointer;
  font-size:13px; font-weight:600; white-space:nowrap; transition:.14s;
  display:flex; align-items:center; gap:8px;
}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--accent); border-bottom-color:var(--accent)}
.tab .cnt{
  font-size:10.5px; font-weight:700; background:var(--surface3); color:var(--muted);
  padding:2px 7px; border-radius:20px; font-variant-numeric:tabular-nums;
}
.tab.active .cnt{background:var(--accent-soft); color:var(--accent)}
.tab .cnt.full{background:var(--ok-soft); color:var(--ok)}

/* ---- toolbar ---- */
.toolbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.search{
  flex:1 1 220px; min-width:160px; background:var(--surface); border:1px solid var(--line);
  color:var(--txt); border-radius:var(--r-sm); padding:9px 12px; font-size:13px; outline:none;
}
.search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  background:var(--surface); border:1px solid var(--line); color:var(--txt);
  padding:9px 14px; border-radius:var(--r-sm); font-size:12.5px; font-weight:600; cursor:pointer; transition:.14s;
}
.btn:hover{border-color:var(--line2); background:var(--surface2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#2563eb}
.btn.danger:hover{border-color:var(--danger); color:var(--danger)}
.chip{
  background:var(--surface); border:1px solid var(--line); color:var(--muted);
  padding:8px 13px; border-radius:30px; font-size:12px; font-weight:600; cursor:pointer; transition:.14s;
}
.chip:hover{color:var(--txt)}
.chip.on{background:var(--accent-soft); border-color:rgba(59,130,246,.35); color:var(--accent)}
.savednote{font-size:11px; color:var(--faint); margin-left:auto}

/* ---- phase / groups ---- */
.phase-head{margin-bottom:20px}
.phase-head .pl{font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--faint); font-weight:700}
.phase-head h2{margin:5px 0 0; font-size:21px; font-weight:800; letter-spacing:-.5px}

.group{margin-bottom:20px}
.ghead{
  display:flex; align-items:center; gap:11px; margin-bottom:11px;
  padding-bottom:9px; border-bottom:1px solid var(--line);
}
.ghead h3{margin:0; font-size:14px; font-weight:700; letter-spacing:-.1px}
.ghead .gc{
  font-size:10.5px; font-weight:700; color:var(--muted); background:var(--surface3);
  padding:2px 8px; border-radius:20px; font-variant-numeric:tabular-nums;
}
.ghead .gc.full{background:var(--ok-soft); color:var(--ok)}
.ghead .gtrack{flex:1; max-width:110px; height:5px; background:var(--surface3); border-radius:10px; overflow:hidden; margin-left:auto}
.ghead .gtrack i{display:block; height:100%; background:var(--ok); border-radius:10px}

/* ---- task ---- */
.task{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:13px 15px; margin-bottom:8px; display:flex; gap:13px; align-items:flex-start;
  transition:.14s; box-shadow:var(--sh);
}
.task:hover{border-color:var(--line2)}
.task.s-done{border-left:3px solid var(--ok); background:linear-gradient(90deg,var(--ok-soft),transparent 55%)}
.task.s-prog{border-left:3px solid var(--warn)}
.task.s-late{border-left:3px solid var(--danger); background:linear-gradient(90deg,var(--danger-soft),transparent 55%)}
.task.s-na{opacity:.5}
.cb{
  appearance:none; -webkit-appearance:none; width:19px; height:19px; margin:2px 0 0; flex:none;
  border:2px solid var(--line2); border-radius:6px; cursor:pointer; position:relative; background:var(--surface2);
  transition:.14s;
}
.cb:hover{border-color:var(--ok)}
.cb:checked{background:var(--ok); border-color:var(--ok)}
.cb:checked::after{content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.tb{flex:1; min-width:0}
.tt{font-size:13.5px; font-weight:500; margin-bottom:2px}
.task.s-done .tt{color:var(--muted); text-decoration:line-through}
.th{font-size:11.5px; color:var(--faint); margin-bottom:10px; line-height:1.45}
.tag{
  display:inline-flex; align-items:center; font-size:9.5px; font-weight:700; letter-spacing:.4px;
  padding:2px 7px; border-radius:5px; margin-left:7px; vertical-align:middle; text-transform:uppercase;
}
.tag.pdf{background:var(--danger-soft); color:#f87171}
.tag.apl{background:var(--warn-soft); color:var(--warn)}
.tag.late{background:var(--danger); color:#fff}
.tag.soon{background:var(--warn); color:#111}

.ctr{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.sel, .dt, .mini{
  background:var(--surface2); border:1px solid var(--line); color:var(--txt);
  border-radius:7px; padding:6px 9px; font-size:11.5px; outline:none; transition:.14s;
}
.sel{cursor:pointer; font-weight:600}
.sel:focus,.dt:focus,.mini:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.sel.v-prog{color:var(--warn); border-color:rgba(245,158,11,.4); background:var(--warn-soft)}
.sel.v-done{color:var(--ok); border-color:rgba(34,197,94,.4); background:var(--ok-soft)}
.sel.v-na{color:var(--na)}
.mini.resp{width:130px}
.mini.note{flex:1 1 170px; min-width:130px}
.arw{color:var(--faint); font-size:11px}

/* ---- table ---- */
.tblwrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
thead th{
  text-align:left; color:var(--faint); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.7px; padding:10px 12px; border-bottom:1px solid var(--line2); font-weight:700; white-space:nowrap;
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
tbody tr.sec td{background:var(--surface3); font-weight:700; font-size:11.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted)}
tbody tr.sec:hover td{background:var(--surface3)}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace; color:var(--accent); font-size:11.5px; font-weight:600}
.fmt{font-size:9.5px; font-weight:700; color:var(--muted); border:1px solid var(--line2); padding:2px 7px; border-radius:5px; white-space:nowrap}
.fire{font-size:9.5px; font-weight:700; color:#f87171; background:var(--danger-soft); padding:2px 7px; border-radius:5px; margin-left:7px; white-space:nowrap}

.empty{text-align:center; padding:50px 20px; color:var(--faint); font-size:13px}
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--muted); margin-top:18px}
.legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px}

/* ---- popovers (colores / opciones) ---- */
.tools{display:flex; gap:7px; align-items:center; flex:none; position:relative}
.pop{
  position:absolute; right:0; top:44px; z-index:70; width:258px;
  background:var(--surface); border:1px solid var(--line2); border-radius:13px;
  box-shadow:0 12px 44px rgba(0,0,0,.34); padding:13px;
}
.pop[hidden]{display:none}
.poph{font-size:10px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--faint); margin:2px 0 9px}
.themes{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px}
.thm{
  border:1px solid var(--line); border-radius:10px; padding:8px 4px; cursor:pointer;
  background:var(--surface2); text-align:center; font-size:10.5px; font-weight:600; color:var(--muted); transition:.14s;
}
.thm:hover{border-color:var(--line2); color:var(--txt)}
.thm.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.thm .sw{display:flex; gap:3px; justify-content:center; margin-bottom:6px}
.thm .sw i{width:12px; height:12px; border-radius:4px; display:block; border:1px solid rgba(128,128,128,.3)}
.accents{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.acc{width:25px; height:25px; border-radius:8px; cursor:pointer; border:2px solid transparent; padding:0}
.acc.on{border-color:var(--txt)}
.custom{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--muted); gap:8px}
.custom input{width:42px; height:27px; border:1px solid var(--line2); border-radius:7px; background:transparent; cursor:pointer; padding:1px}
.popbtn{
  display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--txt);
  padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.popbtn:hover{background:var(--surface2)}
.popbtn.danger{color:var(--danger)}
.popsep{height:1px; background:var(--line); margin:7px 0}

@media print{
  .appbar,.toolbar,.tabs,.iconbtn{display:none}
  body{background:#fff; color:#000}
  .panel,.task,.kpi{break-inside:avoid; box-shadow:none}
}
@media(max-width:640px){
  .appbar-in{padding:10px 14px; gap:12px}
  .wrap{padding:20px 14px 70px}
  .mini.resp{width:100%}

/* =================== ESTADO =================== */
const KEY="oym_dash_v2", NGER=5;
let STATE=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();

const THEMES=[
 {id:"oscuro", n:"Oscuro",  c:["#0f1318","#232a34","#3b82f6"]},
 {id:"claro",  n:"Claro",   c:["#f4f6f9","#ffffff","#2563eb"]},

 {id:"noche",  n:"Noche",   c:["#0b1020","#202a47","#6366f1"]},
 {id:"grafito",n:"Grafito", c:["#141414","#2e2e2e","#a1a1aa"]}];

const OLD={dark:"oscuro",light:"claro"};

let ACCENT=STATE._accent||"";
let activeTab=STATE._tab||"inicio";

function nk(k){return k[0]==="_"?k:("G"+GER+"|"+k)}
function g(k,d){const v=STATE[nk(k)];return v===undefined?d:v}
let st;
function save(){
  STATE._gers=GERS; STATE._ger=GER; STATE._theme=THEME; STATE._accent=ACCENT; STATE._tab=activeTab;
  try{localStorage.setItem(KEY,JSON.stringify(STATE))}catch(e){}

  clearTimeout(st); st=setTimeout(()=>n.textContent="",2600);
}
function set(k,v){STATE[nk(k)]=v;save()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =================== CÁLCULOS =================== */
const STATUSES=["Pendiente","En progreso","Terminado","No aplica"];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parseD=s=>{if(!s)return null;const p=s.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);return d};
const days=(a,b)=>Math.round((b-a)/86400000);

const stOf=t=>g("st_"+t.id,"Pendiente");
const isDone=t=>stOf(t)==="Terminado";
const isNA=t=>stOf(t)==="No aplica";
function isLate(t){
  if(isDone(t)||isNA(t))return false;
  const f=parseD(g("df_"+t.id,"")); return !!f && f<today();
}
function isSoon(t){
  if(isDone(t)||isNA(t))return false;
  const f=parseD(g("df_"+t.id,"")); if(!f)return false;
  const d=days(today(),f); return d>=0&&d<=7;
}
function allTasks(){const a=[];PHASES.forEach(p=>p.groups.forEach(gr=>gr.t.forEach(t=>a.push({t,p,gr}))));return a}

function stats(gerIdx){
  const prev=GER; if(gerIdx!==undefined)GER=gerIdx;
  let done=0,prog=0,total=0,late=0,soon=0,pdfT=0,pdfD=0;
  allTasks().forEach(({t})=>{
    if(isNA(t))return; total++;
    if(isDone(t))done++; else if(stOf(t)==="En progreso")prog++;
    if(isLate(t))late++; else if(isSoon(t))soon++;
    if(t.pdf){pdfT++; if(isDone(t))pdfD++}
  });
  let docT=0,docD=0;
  DOCS.forEach(r=>{if(r.sec)return;docT++;if(g("doc_"+r.c,false))docD++});
  const pct=total?Math.round(done/total*100):0;
  GER=prev;
  return {done,prog,total,late,soon,pdfT,pdfD,docT,docD,pct};
}
function phaseStats(p){
  let done=0,total=0;
  p.groups.forEach(gr=>gr.t.forEach(t=>{if(isNA(t))return;total++;if(isDone(t))done++}));
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function etapaActual(){
  for(const p of PHASES){const s=phaseStats(p); if(s.pct<100)return p.label}
  return "Proyecto completado";
}
const money=n=>{const v=parseFloat(n);return isNaN(v)?null:v.toLocaleString('es-PE',{maximumFractionDigits:0})};

function renderGnav(){
  const el=document.getElementById('gnav'); el.innerHTML='<span class="nlbl">Gerencia</span>';

    const s=stats(i);
    const b=document.createElement('div');
    b.className="gbtn"+(i===GER?" active":"");
    b.innerHTML='<span class="num">'+(i+1)+'</span><span>'+esc(name)+'</span><span class="gp">'+s.pct+'%</span>';
    b.title="Cambiar a "+name+" · "+s.done+"/"+s.total+" tareas";
    b.onclick=()=>switchGer(i);
    el.appendChild(b);
  });
  const r=document.createElement('button');
  r.className="iconbtn"; r.textContent="✎"; r.title="Renombrar gerencia activa";
  r.onclick=renameGer; el.appendChild(r);
  document.getElementById('gtagTxt').textContent=GERS[GER];
}
function switchGer(i){
  GER=i; save(); refreshAll(); window.scrollTo({top:0,behavior:'smooth'});
}
function renameGer(){
  const v=prompt("Nombre de la gerencia "+(GER+1)+":",GERS[GER]);
  if(v===null)return;
  GERS[GER]=v.trim()||("Gerencia "+(GER+1)); save(); renderGnav();
}

/* =================== RENDER: KPIs =================== */
function renderKpis(){
  const s=stats(), el=document.getElementById('kpis');
  const fi=parseD(g("fini","")), ff=parseD(g("ffin",""));
  let timeHtml='<div class="kv">—</div><div class="kf">Define las fechas del proyecto</div>', timeCls="k-mut";
  if(fi&&ff&&ff>=fi){
    const tot=days(fi,ff)||1, el2=days(fi,today()), rest=days(today(),ff);
    const tpct=Math.max(0,Math.min(100,Math.round(el2/tot*100)));
    if(rest<0){timeCls="k-dan";timeHtml='<div class="kv">'+Math.abs(rest)+'<small> d</small></div><div class="kf">Vencido · plazo superado</div>'}
    else{
      timeCls=rest<=15?"k-warn":"k-ok";
      const diff=s.pct-tpct;
      const lbl=diff>=5?"Adelantado":diff<=-5?"Atrasado vs. plan":"En tiempo";
      timeHtml='<div class="kv">'+rest+'<small> d</small></div><div class="kf">'+lbl+' · '+tpct+'% del plazo'+'</div>';
    }
  }
  const pre=parseFloat(g("presu","")), eje=parseFloat(g("ejec",""));
  let budHtml='<div class="kv">—</div><div class="kf">Registra el presupuesto</div>', budCls="k-mut";
  if(!isNaN(pre)&&pre>0){
    const e=isNaN(eje)?0:eje, bp=Math.round(e/pre*100);
    budCls=bp>100?"k-dan":bp>90?"k-warn":"k-ok";
    budHtml='<div class="kv">'+bp+'<small>%</small></div><div class="kf">'+money(e)+' / '+money(pre)+(bp>100?' · sobregiro':'')+'</div>';
  }
  const C=2*Math.PI*30;
  el.innerHTML=
   '<div class="kpi '+(s.pct===100?'k-ok':'')+'"><div class="kl">Avance global</div>'+
     '<div class="kpi-ring"><div class="ring"><svg width="72" height="72">'+
       '<circle cx="36" cy="36" r="30" stroke="var(--surface3)" stroke-width="7" fill="none"/>'+
       '<circle cx="36" cy="36" r="30" stroke="'+(s.pct===100?'var(--ok)':'var(--accent)')+'" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-s.pct/100))+'"/>'+
     '</svg><div class="pct">'+s.pct+'%</div></div>'+
     '<div style="font-size:11.5px;color:var(--muted);line-height:1.7">'+
       '<div><b style="color:var(--ok)">'+s.done+'</b> terminadas</div>'+
       '<div><b style="color:var(--warn)">'+s.prog+'</b> en progreso</div>'+
       '<div><b>'+s.total+'</b> aplicables</div></div></div></div>'+

   '<div class="kpi '+(s.late?'k-dan':'k-ok')+'"><div class="kl">Tareas atrasadas</div>'+
     '<div class="kv">'+s.late+'</div><div class="kf">'+(s.late?'Requieren atención inmediata':'Sin atrasos registrados')+'</div></div>'+

   '<div class="kpi '+timeCls+'"><div class="kl">Plazo restante</div>'+timeHtml+'</div>'+

   '<div class="kpi '+(s.pdfD===s.pdfT&&s.pdfT?'k-ok':'k-warn')+'"><div class="kl">Entregables PDF</div>'+
     '<div class="kv">'+s.pdfD+'<small>/'+s.pdfT+'</small></div><div class="kf">Documentos formales del proceso</div></div>'+

   '<div class="kpi '+budCls+'"><div class="kl">Presupuesto ejecutado</div>'+budHtml+'</div>';

  document.getElementById('etapaTxt').textContent="Etapa actual: "+etapaActual();
}

/* =================== RENDER: TABS =================== */
function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML="";
  PHASES.forEach((p,i)=>{
    const s=phaseStats(p);
    const b=document.createElement('button');
    b.className="tab"+(p.id===activeTab?" active":"");
    b.innerHTML=(i+1)+'. '+p.label+'<span class="cnt'+(s.pct===100?' full':'')+'">'+s.done+'/'+s.total+'</span>';
    b.onclick=()=>{activeTab=p.id;save();renderTabs();renderContent()};
    el.appendChild(b);
  });
}

/* =================== RENDER: CONTENIDO =================== */
function matches(t){
  if(query&&!(t.x+" "+(t.hint||"")).toLowerCase().includes(query))return false;
  if(filter==="all")return true;
  if(filter==="late")return isLate(t);
  return stOf(t)===filter;
}
function renderContent(){
  const c=document.getElementById('content'); c.innerHTML="";
  if(activeTab==="docs")return renderDocs(c);
  const p=PHASES.find(x=>x.id===activeTab), s=phaseStats(p);
  c.insertAdjacentHTML('beforeend',
    '<div class="phase-head"><div class="pl">'+p.plan+'</div><h2>'+p.label+'</h2></div>');
  let shown=0;
  p.groups.forEach(gr=>{
    const vis=gr.t.filter(matches); if(!vis.length)return;
    shown+=vis.length;
    const done=gr.t.filter(isDone).length, tot=gr.t.filter(t=>!isNA(t)).length;
    const pct=tot?Math.round(done/tot*100):0;
    const el=document.createElement('div'); el.className="group";
    el.innerHTML=gr.h?('<div class="ghead"><h3>'+esc(gr.h)+'</h3>'+
      '<span class="gc'+(pct===100?' full':'')+'">'+done+'/'+tot+'</span>'+
      '<span class="gtrack"><i style="width:'+pct+'%"></i></span></div>'):'';
    vis.forEach(t=>el.appendChild(taskEl(t)));
    c.appendChild(el);
  });
  if(!shown)c.insertAdjacentHTML('beforeend','<div class="empty">No hay tareas que coincidan con el filtro.</div>');
}

function taskEl(t){
  const v=stOf(t), late=isLate(t), soon=isSoon(t);
  const row=document.createElement('div');
  row.className="task "+(v==="Terminado"?"s-done":late?"s-late":v==="En progreso"?"s-prog":v==="No aplica"?"s-na":"");

  const cb=document.createElement('input');
  cb.type="checkbox"; cb.className="cb"; cb.checked=(v==="Terminado");
  cb.onchange=()=>setStatus(t,cb.checked?"Terminado":"Pendiente");

  const b=document.createElement('div'); b.className="tb";
  let tags="";
  if(t.pdf)tags+='<span class="tag pdf">PDF</span>';
  if(t.apl)tags+='<span class="tag apl">¿Aplica?</span>';
  if(late)tags+='<span class="tag late">Atrasada</span>';
  else if(soon)tags+='<span class="tag soon">Por vencer</span>';
  b.innerHTML='<div class="tt">'+esc(t.x)+tags+'</div>'+(t.hint?'<div class="th">'+esc(t.hint)+'</div>':'');

  const ctr=document.createElement('div'); ctr.className="ctr";
  const sel=document.createElement('select');
  sel.className="sel "+(v==="Terminado"?"v-done":v==="En progreso"?"v-prog":v==="No aplica"?"v-na":"");
  STATUSES.forEach(s=>{const o=document.createElement('option');o.value=o.textContent=s;if(s===v)o.selected=true;sel.appendChild(o)});
  sel.onchange=()=>setStatus(t,sel.value);

  const resp=document.createElement('input');
  resp.className="mini resp"; resp.placeholder="Responsable";
  resp.value=g("rs_"+t.id,""); resp.oninput=()=>set("rs_"+t.id,resp.value);

  const di=document.createElement('input');
  di.type="date"; di.className="dt"; di.title="Fecha de inicio";
  di.value=g("di_"+t.id,""); di.onchange=()=>{set("di_"+t.id,di.value);refreshHead()};

  const ar=document.createElement('span'); ar.className="arw"; ar.textContent="→";

  const df=document.createElement('input');
  df.type="date"; df.className="dt"; df.title="Fecha final";
  df.value=g("df_"+t.id,""); df.onchange=()=>{set("df_"+t.id,df.value);renderContent();refreshHead()};

  const nt=document.createElement('input');
  nt.className="mini note"; nt.placeholder="Notas / observaciones";
  nt.value=g("nt_"+t.id,""); nt.oninput=()=>set("nt_"+t.id,nt.value);

  ctr.append(sel,resp,di,ar,df,nt); b.appendChild(ctr);
  row.append(cb,b); return row;
}
function setStatus(t,v){set("st_"+t.id,v);renderContent();refreshHead()}
function refreshHead(){renderGnav();renderKpis();renderTabs()}

function renderDocs(c){
  const s=stats();
  c.insertAdjacentHTML('beforeend',
   '<div class="phase-head"><div class="pl">Índice documental</div><h2>Expediente del Proyecto</h2></div>'+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-b" style="padding:14px 18px">'+
   '<div class="pbar"><div class="pt"><b>Documentos archivados</b><span>'+s.docD+'/'+s.docT+'</span></div>'+
   '<div class="track"><i style="width:'+(s.docT?s.docD/s.docT*100:0)+'%"></i></div></div></div></div>');
  const wrap=document.createElement('div'); wrap.className="panel";
  const tw=document.createElement('div'); tw.className="tblwrap";
  const tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th style="width:40px"></th><th style="width:100px">Código</th><th>Documento</th><th style="width:150px">Responsable</th><th style="width:120px">Fecha</th><th style="width:90px">Formato</th></tr></thead>';
  const tb=document.createElement('tbody');
  let shown=0;
  DOCS.forEach(r=>{
    if(r.sec){const tr=document.createElement('tr');tr.className="sec";tr.innerHTML='<td colspan="6">'+esc(r.sec)+'</td>';tb.appendChild(tr);return}
    if(query&&!(r.c+" "+r.d).toLowerCase().includes(query))return;
    shown++;
    const tr=document.createElement('tr');
    const td0=document.createElement('td');
    const cb=document.createElement('input');
    cb.type="checkbox"; cb.className="cb"; cb.style.cssText="width:17px;height:17px";
    cb.checked=g("doc_"+r.c,false);
    cb.onchange=()=>{set("doc_"+r.c,cb.checked);refreshHead()};
    td0.appendChild(cb); tr.appendChild(td0);
    tr.insertAdjacentHTML('beforeend','<td><span class="code">'+r.c+'</span></td>');
    tr.insertAdjacentHTML('beforeend','<td>'+esc(r.d)+(r.f?'<span class="fire">Antifuego</span>':'')+'</td>');
    const td3=document.createElement('td');
    const ri=document.createElement('input'); ri.className="mini"; ri.style.width="100%"; ri.placeholder="—";
    ri.value=g("docr_"+r.c,""); ri.oninput=()=>set("docr_"+r.c,ri.value);
    td3.appendChild(ri); tr.appendChild(td3);
    const td4=document.createElement('td');
    const dd=document.createElement('input'); dd.type="date"; dd.className="dt"; dd.style.width="100%";
    dd.value=g("docd_"+r.c,""); dd.onchange=()=>set("docd_"+r.c,dd.value);
    td4.appendChild(dd); tr.appendChild(td4);
    tr.insertAdjacentHTML('beforeend','<td><span class="fmt">'+r.e+'</span></td>');
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); tw.appendChild(tbl); wrap.appendChild(tw); c.appendChild(wrap);
  if(!shown)c.insertAdjacentHTML('beforeend','<div class="empty">Ningún documento coincide con la búsqueda.</div>');
}

/* =================== CAMPOS SUPERIORES =================== */
function loadFields(){document.querySelectorAll('[data-k]').forEach(i=>i.value=g(i.dataset.k,""))}
document.querySelectorAll('[data-k]').forEach(i=>{
  const ev=i.tagName==="SELECT"?"change":"input";
  i.addEventListener(ev,()=>{set(i.dataset.k,i.value);renderKpis()});
});

/* =================== OPCIONES =================== */
document.getElementById('btnPrint').onclick=()=>window.print();
document.getElementById('btnExport').onclick=()=>{
  const rows=[["Gerencia","Fase","Grupo","Tarea","Estado","Responsable","Inicio","Fin","Notas"]];
  allTasks().forEach(({t,p,gr})=>rows.push([GERS[GER],p.label,gr.h,t.x,stOf(t),g("rs_"+t.id,""),g("di_"+t.id,""),g("df_"+t.id,""),g("nt_"+t.id,"")]));
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=(g("numero","")||GERS[GER].replace(/\s+/g,"-"))+"-seguimiento.csv"; a.click();
};
document.getElementById('btnReset').onclick=()=>{
  if(!confirm('¿Reiniciar el seguimiento de "'+GERS[GER]+'"?\n\nSe borrarán estados, fechas, responsables y notas de esta gerencia. Las demás gerencias no se modifican.'))return;
  Object.keys(STATE).forEach(k=>{if(k.indexOf("G"+GER+"|")===0)delete STATE[k]});
  save(); refreshAll();
};
/* =================== TEMA Y COLORES =================== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',THEME);
  if(ACCENT)document.documentElement.style.setProperty('--accent',ACCENT);
  else document.documentElement.style.removeProperty('--accent');
  renderPalette();
}
function renderPalette(){
  const tl=document.getElementById('themeList'); tl.innerHTML="";
  THEMES.forEach(t=>{
    const b=document.createElement('div');
    b.className="thm"+(t.id===THEME?" on":"");
    b.innerHTML='<span class="sw">'+t.c.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span>'+t.n;
    b.onclick=()=>{THEME=t.id;save();applyTheme();renderKpis()};
    tl.appendChild(b);
  });
  const al=document.getElementById('accentList'); al.innerHTML="";
  ACCENTS.forEach(c=>{
    const b=document.createElement('button');
    b.className="acc"+(ACCENT===c?" on":""); b.style.background=c; b.title=c;
    b.onclick=()=>{ACCENT=c;save();applyTheme();renderKpis()};
    al.appendChild(b);
  });
  const rb=document.createElement('button');
  rb.className="acc"+(ACCENT?"":" on"); rb.title="Color propio del tema";
  rb.style.cssText="background:transparent;border:2px dashed var(--line2);color:var(--faint);font-size:13px;line-height:1";
  rb.textContent="↺";
  rb.onclick=()=>{ACCENT="";save();applyTheme();renderKpis()};
  al.appendChild(rb);
  const cc=document.getElementById('accentCustom');
  cc.value=ACCENT||getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||"#3b82f6";
  cc.oninput=()=>{ACCENT=cc.value;save();applyTheme();renderKpis()};
}
/* abrir / cerrar popovers */
function togglePop(id){
  ['popPal','popMenu'].forEach(p=>{
    const el=document.getElementById(p);
    if(p===id)el.hidden=!el.hidden; else el.hidden=true;
  });
}
document.getElementById('btnPal').onclick=e=>{e.stopPropagation();togglePop('popPal')};
document.getElementById('btnMenu').onclick=e=>{e.stopPropagation();togglePop('popMenu')};
document.querySelectorAll('.pop').forEach(p=>p.addEventListener('click',e=>e.stopPropagation()));
document.addEventListener('click',()=>togglePop(null));
document.addEventListener('keydown',e=>{if(e.key==="Escape")togglePop(null)});

/* =================== INIT =================== */
function refreshAll(){loadFields();renderGnav();renderKpis();renderTabs();renderContent()}
if(!PHASES.some(p=>p.id===activeTab))activeTab="inicio";
applyTheme();
refreshAll();
</script>
